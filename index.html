/* ---- 连续拆解进度 --------------------------------------------------
   一个 0→1 的值同时驱动 9 个部件的位移、标签显隐和相机退让。
   点按钮 = 缓动到目标；拖滑杆 = 直接跟手。单件聚焦时这个值原地冻结，
   退出聚焦再接着用，所以聚焦前后的画面不会跳。
------------------------------------------------------------------- */
let explodeP = 0, explodeT = 0, explodeDrag = false;
const EX_LABEL = 0.55;                       // 拆过这个比例，名字和引线才浮出来

const exRange = document.getElementById('exRange');
const exVal = document.getElementById('exVal');
const explodeUI = document.getElementById('explodeUI');

/* 相机随进度退让：拆得越开，机位越高越远，别让月亮顶出画面 */
function followExplodeCamera(v){
  if (userZoomed) return;                    // 用户自己缩放过，就别抢镜头
  const r0 = fitRadius();
  const spread = window.innerWidth < 820 ? 2.30 : 1.74;
  orbit.tRadius = r0 + (r0 * spread - r0) * v;
  orbit.tTarget.y = 1.34 + 1.0 * v;
}

function syncExplodeUI(){
  const pct = Math.round(explodeP * 100);
  if (exVal) exVal.textContent = pct + '%';
  if (exRange){
    if (document.activeElement !== exRange) exRange.value = (explodeP * 100).toFixed(1);
    exRange.style.setProperty('--p', pct);
  }
  if (explodeUI) explodeUI.classList.toggle('on', explodeP > 0.004);
  if (!focusPart){
    const on = explodeP > EX_LABEL;
    listedParts.forEach(p => { if (p.on !== on) setPart(p, on); });
  }
}

function setExplode(v, opt){
  v = clamp(v, 0, 1);
  opt = opt || {};
  if (focusPart) endFocus({ camera: false });
  explodeT = v;
  if (opt.instant || opt.manual) explodeP = v;
  explodeDrag = !!opt.manual;
  syncExplodeUI();
  if (opt.camera) followExplodeCamera(v);
  if (opt.manual !== true) refreshUI();
}

const btnAll = document.getElementById('btnAll');

  p.on = on;

}

/* ---- 标签与引线 --------------------------------------------------
   位置完全由"序号"决定：奇偶决定左右列，列内按拆开后的世界高度排队，
   相机怎么转都不会让名字换边、换行；跟着动的只有圆点和线。
   圆点放在部件包围球之外，线只穿过空白区，不会压在身上。
------------------------------------------------------------------ */
const vTmp = new THREE.Vector3();
const _cV = new THREE.Vector3();

/* 包围球（自身坐标系）算一次：把圆点推到轮廓外要用的半径 */
(function measureParts(){
  const box = new THREE.Box3(), sph = new THREE.Sphere(), sz = new THREE.Vector3();
  listedParts.forEach(p => {
    p.root.updateWorldMatrix(true, true);
    box.setFromObject(p.root);
    if (box.isEmpty()){
      p.cOff = new THREE.Vector3(0, 0, 0);
      p.half = 0.5;
    } else {
      box.getBoundingSphere(sph);
      box.getSize(sz);
      p.cOff = sph.center.clone().sub(p.root.position);
      /* 水平半宽：圆点沿水平方向推到轮廓外，比用包围球半径稳 */
      p.half = Math.max(sz.x, sz.z) * 0.5;
    }
    /* 拆开后的视觉高度（与相机无关），列内按它排队，线才不会打结 */
    p.rowKey = p.home.y + p.cOff.y + p.off.y;
  });

  /* 错峰相位：拆解顺序按"拆开后的高度"排，顶上的月亮先走，底层最后下沉，
     像真的在一层层拆，而不是九个零件同时弹开 */
  const keys = listedParts.map(p => p.rowKey);
  const lo = Math.min(...keys), hi = Math.max(...keys);
  const span = Math.max(hi - lo, 1e-3);
  listedParts.forEach(p => {
    p.delay = (1 - (p.rowKey - lo) / span) * 0.15;
  });
})();

function hideLabel(p){
  p.el.style.opacity = 0;
  p.leadPath.style.opacity = 0;
  p.leadDot.style.opacity = 0;
}

let labW = -1, labH = -1;

/* 左右两列的行位：只跟窗口尺寸和部件序号有关，跟相机无关 */
function layoutLabels(w, h){
  const wide = w >= 860;
  const padL = wide ? 46 : Math.min(26, w * 0.05);
  const padR = wide ? 300 : Math.min(26, w * 0.05);   // 宽屏给右侧清单让位

  for (const side of [-1, 1]){
    /* 世界坐标越高，屏幕上越靠上 */
    const arr = listedParts.filter(p => p.side === side)
                           .sort((a, b) => b.rowKey - a.rowKey);
    const n = arr.length;
    const gap = n > 1 ? Math.min((h - 250) / (n - 1), 86) : 80;
    const total = gap * Math.max(n - 1, 0);
    let top = h * 0.47 - total * 0.5;
    top = Math.max(top, 84);
    arr.forEach((p, k) => {
      p.slotY = clamp(top + k * gap, p.lh * 0.5 + 14, h - p.lh * 0.5 - 14);
      p.slotX = clamp(side < 0 ? padL + p.lw * 0.5 : w - padR - p.lw * 0.5,
                      p.lw * 0.5 + 8, w - p.lw * 0.5 - 8);
    });
  }
}

function updateLabels(){
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (w !== labW || h !== labH){ labW = w; labH = h; layoutLabels(w, h); }

  const pxPerUnit = (h * 0.5) / Math.tan(camera.fov * Math.PI / 360);

  for (const p of listedParts){
    /* 拆到 EX_LABEL 之后名字才浮出来：中间态零件还在半空，引线会互相打架 */
    if (focusPart || p.p < EX_LABEL){ hideLabel(p); continue; }

    _cV.copy(p.root.position).add(p.cOff);
    const dist = camera.position.distanceTo(_cV) || 1;
    vTmp.copy(_cV).project(camera);
    if (vTmp.z > 1){ hideLabel(p); continue; }

    const ax = (vTmp.x * 0.5 + 0.5) * w;
    const ay = (-vTmp.y * 0.5 + 0.5) * h;

    /* 圆点：贴着部件轮廓外缘、朝着自己那列的方向，横向推出去。
       但最多推到"部件与标签的中点"，否则大圆盘会把点一路顶到标签边上，
       引线被压成一小截，看起来像点自己长了个名字 */
    const halfPx = p.half * pxPerUnit / dist;
    const ex0 = p.slotX + (p.side < 0 ? 1 : -1) * (p.lw * 0.5 + 4);
    const push = Math.min(halfPx * 0.94 + 12,
                          Math.max(22, Math.abs(ex0 - ax) * 0.55));
    let dx = ax + p.side * push;
    if (p.side < 0) dx = Math.max(dx, ex0 + 34);
    else dx = Math.min(dx, ex0 - 34);
    const dy = ay;

    const ex = ex0;

    const op = clamp((p.p - EX_LABEL) / 0.12, 0, 1) * 0.96;
    p.el.style.transform = 'translate(-50%,-50%) translate(' +
      p.slotX.toFixed(1) + 'px,' + p.slotY.toFixed(1) + 'px)';
    p.el.style.opacity = op;

    p.leadPath.setAttribute('d', 'M' + dx.toFixed(1) + ' ' + dy.toFixed(1) +
                                 'L' + ex.toFixed(1) + ' ' + p.slotY.toFixed(1));
    p.leadPath.style.opacity = op * 0.85;
    p.leadDot.setAttribute('cx', dx.toFixed(1));
    p.leadDot.setAttribute('cy', dy.toFixed(1));
    p.leadDot.style.opacity = op * 0.9;
  }
}

/* ============================================================
   8. 主循环
   ============================================================ */
let last = performance.now();
let introP = 0;
let frameCount = 0;

/* 把 dim / 焦点强度落到材质：透明度、自发光、环境反射 */
function applyLook(p){
  const d = p.dim, f = p.appF;
  /* 多层几何叠加会累积 alpha，所以直接淡到 0 再整组隐藏 */
  const op = clamp(1 - d * 1.18, 0, 1);
  const tr = op < 0.995;
  for (const m of p.mats){
    if (m.transparent !== tr) m.transparent = tr;
    m.opacity = op;
    if (m.emissive && m.userData.baseEmissive !== undefined){
      /* 夜里要点亮的东西（星、月牙）在聚焦时不再盖粉光，否则整块变成粉的 */
      if (f > 0.002 && !(m.userData.nightEI && night.p > 0.4)){
        /* 注意：基线 emissiveIntensity 是 1（配黑色自发光等于无效），
           这里必须用绝对值，否则等于给整件灌满全强度粉光 */
        m.emissive.setHex(0xffa9c7);
        m.emissiveIntensity = 0.11 * f;
      } else {
        m.emissive.setHex(m.userData.baseEmissive);
        m.emissiveIntensity = m.userData.baseEI || 0;
      }
    }
    if (m.userData.baseEnv !== undefined){
      m.envMapIntensity = m.userData.baseEnv * (1 - 0.50 * d) * (1 + 0.12 * f);
    }
  }
  /* 虚化的部件退到背景下，就不要再往焦点上打影子了 */
  for (const o of p.meshes){
    const want = d > 0.35 ? false : !!o.userData.baseCast;
    if (o.castShadow !== want) o.castShadow = want;
  }
  const vis = op > 0.004;
  if (p.root.visible !== vis) p.root.visible = vis;
}

const _kidQ = new THREE.Quaternion();
const _spinQ = new THREE.Quaternion();
const _AXIS_X = new THREE.Vector3(1, 0, 0);
let exShown = -1;

function updateParts(dt, t){
  /* 一条进度驱动全场：拖滑杆时逐帧跟手，点按钮时缓动过去。
     除了它，没有任何"第几个部件该动"的独立状态。 */
  if (!explodeDrag){
    explodeP += (explodeT - explodeP) * (1 - Math.exp(-dt * 6.5));
    if (Math.abs(explodeT - explodeP) < 0.0006) explodeP = explodeT;
  }
  const shown = Math.round(explodeP * 100);
  if (shown !== exShown){ exShown = shown; syncExplodeUI(); }

  for (const p of parts){
    /* 目标只有一个：底座不动；聚焦时焦点件单独走到 1，其余停在当前进度；
       平时全体共用拆解进度 */
    const target = !p.listed ? 0
                 : focusPart ? (focusPart === p ? 1 : explodeP)
                 : explodeP;

    if (explodeDrag && !focusPart) p.p = target;
    else {
      p.p += (target - p.p) * (1 - Math.exp(-dt * 6.5));
      if (Math.abs(target - p.p) < 0.0005) p.p = target;
    }

    /* 错峰：每个部件从 delay 之后才开始动，但终点都是 1 —— 拆的时候顶上的
       月亮先走、底层最后下沉，合的时候顺序自动反过来 */
    const e = clamp((p.p - p.delay) / (1 - p.delay), 0, 1);

    p.root.position.copy(p.home).addScaledVector(p.off, e);
    if (e > 0.001) p.root.position.y += Math.sin(t * 1.15 + p.phase) * 0.045 * e;

    /* 大件只允许绕自己的中轴转，不跟着位移侧翻 */
    if (p.spinAxis){
      _spinQ.setFromAxisAngle(p.spinAxis, e * p.spinAmt);
      p.root.quaternion.copy(_spinQ).multiply(p.homeQ);
    }
    for (const k of p.kids){
      k.o.position.copy(k.home).addScaledVector(k.dir, e * k.amt);
      if (k.rise) k.o.position.y += k.rise * e;
      if (k.tilt){
        _kidQ.setFromAxisAngle(_AXIS_X, k.tilt * e);
        k.o.quaternion.copy(k.homeQ).multiply(_kidQ);
      }
    }

    /* 其余部件：退后一点 + 淡出，做成"虚化"的观感 */
    const dTarget = (focusPart && focusPart !== p) ? 1 : 0;
    p.dim += (dTarget - p.dim) * (1 - Math.exp(-dt * 7.0));
    if (Math.abs(dTarget - p.dim) < 0.002) p.dim = dTarget;

    const isFocus = focusPart === p;
    const f = isFocus ? e : (p.appF > 0 ? p.appF * Math.exp(-dt * 8) : 0);

    if (p.dim > 0.001 || f > 0.001){
      p.root.scale.copy(p.homeScale).multiplyScalar(1 - 0.09 * p.dim + 0.17 * f);
    } else if (Math.abs(p.root.scale.x - p.homeScale.x) > 1e-4){
      p.root.scale.copy(p.homeScale);
    }

    if (Math.abs(p.dim - p.appDim) > 0.004 || Math.abs(f - p.appF) > 0.004){
      p.appDim = p.dim; p.appF = f;
      applyLook(p);
    }
  }
}

const _dirV = new THREE.Vector3();
function updateFocus(dt, t, now){
  if (focusPart){
    glowAnchor.copy(focusPart.root.position).add(focusPart.glowOff);
    orbit.tTarget.copy(glowAnchor);
    if (now < focusCamUntil) orbit.tRadius = focusFitRadius(focusPart.glowR);
    glowP += (1 - glowP) * (1 - Math.exp(-dt * 5.0));
    /* 微收一档曝光，给高光留出层次，主体和背景也拉开了 */
    renderer.toneMappingExposure = 0.84 - 0.06 * glowP;
    glowSprite.visible = true;
    /* 把光环推到部件中心之后（远离相机），让它只从轮廓外缘漏出来 */
    _dirV.copy(glowAnchor).sub(camera.position).normalize();
    glowSprite.position.copy(glowAnchor).addScaledVector(_dirV, focusPart.glowR * 0.62);
    /* 光晕直径再按屏幕尺寸封顶，避免大件把整屏糊上一层 */
    const dist = camera.position.distanceTo(glowAnchor) || 1;
    const maxGs = Math.tan(camera.fov * Math.PI / 360) * dist * 1.55;
    const gs = Math.min(focusPart.glowR * 1.30, maxGs) * (1 + 0.03 * Math.sin(t * 1.6));
    glowSprite.scale.set(gs, gs, 1);
    glowSprite.material.opacity = glowP;

    /* 补光：与主光同向的左上方一束，给单独取出的部件补形体（不从镜头正面打，避免拍平） */
    focusLampP += (1 - focusLampP) * (1 - Math.exp(-dt * 4.2));
    focusLight.intensity = 0.30 * focusLampP;
    focusLight.position.copy(glowAnchor).add(_dirV.set(-3.2, 5.4, 4.2));
    focusLight.target.position.copy(glowAnchor);
    focusLight.target.updateMatrixWorld();
  } else if (glowP > 0.002){
    glowP *= Math.exp(-dt * 6.5);
    glowSprite.material.opacity = glowP;
    glowSprite.position.copy(glowAnchor);
    if (glowP <= 0.002){ glowP = 0; glowSprite.visible = false; }
    focusLampP *= Math.exp(-dt * 5.5);
    focusLight.intensity = 0.30 * focusLampP;
    renderer.toneMappingExposure = 0.84 - 0.06 * glowP;
  }
}

/* ============================================================
   7.5 关灯模式：棚灯全灭，星星与月亮自己亮起来
   ============================================================ */
const night = { on: false, p: 0, was: 0 };
const BASE_LIGHT = {
  key: key.intensity, rim: rim.intensity, fill: fill.intensity,
  bounce: bounce.intensity, hemi: hemi.intensity
};

/* 冷月光补光：只是让暗部别糊成一片黑，不能照回"白天" */
const nightFill = new THREE.DirectionalLight(0x93a9de, 0);
nightFill.position.set(-5.2, 3.6, -4.2);
scene.add(nightFill);

/* 暖色光晕贴图 */
const warmGlowTex = (function(){
  const S = 256, cv = makeCanvas(S, S), g = cv.getContext('2d');
  const rg = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  rg.addColorStop(0.00, 'rgba(255,236,182,0.90)');
  rg.addColorStop(0.16, 'rgba(255,206,110,0.48)');
  rg.addColorStop(0.40, 'rgba(250,180,70,0.16)');
  rg.addColorStop(1.00, 'rgba(244,168,58,0)');
  g.fillStyle = rg; g.fillRect(0, 0, S, S);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();

const nightHaloes = [];
function addHalo(parent, size, y, op){
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: warmGlowTex, transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, opacity: 0, toneMapped: false
  }));
  sp.position.set(0, y, 0);
  sp.scale.set(size, size, 1);
  sp.renderOrder = 15;
  sp.visible = false;
  parent.add(sp);
  nightHaloes.push({ sp, op, ph: rr(0, 6.28) });
  return sp;
}

/* 月牙本身一层薄的暖光，别做太大，否则整块糊成白雾 */
addHalo(partMoon.root, 1.55, 0.06, 0.34);

/* 光源挂在那颗最大的金星上（月牙上端尖角那颗），拆解/自转时跟着走 */
const moonStar = partMoon.root.userData.topStar || partMoon.root;
const moonLight = new THREE.PointLight(0xffbe48, 0, 14, 1.9);
moonLight.position.set(0, 0, 0.03);
moonStar.add(moonLight);
/* 大星外面再罩一圈黄色星芒，让"光源"这件事看得出来 */
addHalo(moonStar, 0.95, 0, 0.42);

const starLights = [];
const starKids = partStars.root.children.filter(o => o.isMesh);
starKids.forEach((mesh, i) => {
  const big = i % 3 === 0;
  addHalo(mesh, big ? 0.50 : 0.32, 0, big ? 0.40 : 0.26);
  if (i === 0 || i === 4){
    const pl = new THREE.PointLight(0xffb936, 0, 6.0, 2.0);
    pl.position.set(0, 0, 0);
    mesh.add(pl);
    starLights.push({ pl, k: i === 0 ? 0.78 : 0.55 });
  }
});

/* 月牙本身的材质要压得住：只让它自己亮，不把周围蛋糕一起提亮 */
const nightGlowMats = [];
parts.forEach(p => p.mats.forEach(m => {
  if (m.userData.nightEI) nightGlowMats.push(m);
}));

/* 白瓷盘在暗场里会白得抢眼，压一档让它退回剪影 */
const C_PLATE_NIGHT = new THREE.Color(0x6a5f64);
const plateMats = partPlate.mats.filter(m => m.userData.baseColor !== undefined);

const nightSkyEl = document.getElementById('nightSky');
const btnNight = document.getElementById('btnNight');
const btnNightText = document.getElementById('btnNightText');

function updateNight(dt, t){
  const tgt = night.on ? 1 : 0;
  night.p += (tgt - night.p) * (1 - Math.exp(-dt * 2.6));
  if (Math.abs(tgt - night.p) < 0.0012) night.p = tgt;
  const d = night.p;

  key.intensity    = BASE_LIGHT.key    * (1 - 0.958 * d);
  rim.intensity    = BASE_LIGHT.rim    * (1 - 0.86 * d);
  fill.intensity   = BASE_LIGHT.fill   * (1 - 0.78 * d);
  bounce.intensity = BASE_LIGHT.bounce * (1 - 0.90 * d);
  hemi.intensity   = BASE_LIGHT.hemi   * (1 - 0.62 * d) + 0.016 * d;
  nightFill.intensity = 0.13 * d;
  if ('environmentIntensity' in scene) scene.environmentIntensity = 1 - 0.86 * d;
  contactM.material.opacity = 0.66 * (1 - 0.66 * d);

  moonLight.intensity = 2.15 * d;
  for (const s of starLights) s.pl.intensity = 0.62 * s.k * d;

  for (const h of nightHaloes){
    const vis = d > 0.004;
    if (h.sp.visible !== vis) h.sp.visible = vis;
    if (vis) h.sp.material.opacity = h.op * d * (1 + 0.08 * Math.sin(t * 1.7 + h.ph));
  }

  if (d > 0.0015 || night.was > 0.0015){
    for (const m of nightGlowMats){
      m.emissiveIntensity = d > 0.0015 ? m.userData.nightEI * d : (m.userData.baseEI || 0);
    }
    for (const m of plateMats){
      m.color.setHex(m.userData.baseColor).lerp(C_PLATE_NIGHT, 0.62 * d);
    }
  }
  night.was = d;
}

btnNight.addEventListener('click', () => {
  night.on = !night.on;
  btnNight.classList.toggle('on', night.on);
  btnNightText.textContent = night.on ? '开灯' : '关灯';
  document.body.classList.toggle('night', night.on);
  nightSkyEl.classList.toggle('on', night.on);
  orbit.lastInput = performance.now();
});

function tick(){
  requestAnimationFrame(tick);
  frameCount++;
  const now = performance.now();
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const t = now * 0.001;

  updateGift(dt, t);
  updateConfetti(dt);

  /* 蛋糕要等礼盒炸开才长出来 —— 先开盒，再有蛋糕 */
  if (introP < 1 && gift.cakeIn){
    introP = Math.min(1, introP + dt / 1.15);
    const c1 = 1.70158, c3 = c1 + 1, x = introP - 1;
    const s = 1 + c3 * x * x * x + c1 * x * x;
    cakeRoot.scale.setScalar(Math.max(0.002, s * 0.999 + 0.001));
    const endR = fitRadius();
    orbit.tRadius = endR * 1.45 + (endR - endR * 1.45) * s;
  }

  updateParts(dt, t);
  updateFocus(dt, t, now);
  updateNight(dt, t);
  updateCamera(dt);
  updateLake(t);
  updateLabels();
  renderer.render(scene, camera);
}

/* ---- 尺寸 ---- */
function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w / h < 0.85 ? 58 : 38;
  camera.updateProjectionMatrix();
  if (!userZoomed){
    if (!gift.done){
      /* 礼盒还没拆完（含爆开中）：取景按盒子算，别被"蛋糕那套"顶掉 */
      const bk = gift.cakeIn ? clamp((gift.burstT - 0.1) / 0.5, 0, 1) : 0;
      const gr = giftRadius() * (1 - 0.06 * bk);
      orbit.tRadius = gr; orbit.radius = gr;
      orbit.target.y = orbit.tTarget.y = gift.centerY + (1.34 - gift.centerY) * bk;
      return;
    }
    const r = fitRadius();
    orbit.tRadius = r;
    if (introP >= 1) orbit.radius = r;
    /* 已经拆开时按进度重算取景，否则改窗口大小会把构图打回未拆的默认值 */
    if (explodeP > 0.001){
      followExplodeCamera(explodeP);
      orbit.radius = orbit.tRadius;
      orbit.target.copy(orbit.tTarget);
    }
  }
}
window.addEventListener('resize', resize);

/* 可选的机位参数（分享时能固定一个好看的视角）：?r=6.2&phi=1.15&theta=0.9&y=0.55&still=1
   ?p=0.5 直接停在某个拆解进度，便于截图和分享固定画面 */
(function viewFromURL(){
  const q = new URLSearchParams(location.search);
  const num = k => (q.has(k) && !isNaN(parseFloat(q.get(k))) ? parseFloat(q.get(k)) : null);
  const r = num('r'), ph = num('phi'), th = num('theta'), yy = num('y');
  if (r !== null){ orbit.radius = orbit.tRadius = r; }
  if (ph !== null){ orbit.phi = orbit.tPhi = ph; }
  if (th !== null){ orbit.theta = orbit.tTheta = th; }
  if (yy !== null){ orbit.target.y = orbit.tTarget.y = yy; }
  if (r !== null || ph !== null || th !== null || yy !== null) userZoomed = true;
  if (q.has('still')){
    introP = 1;
    /* 静态/截图模式：标签不要再淡入，直接给终值，否则抓到的是一帧半透明的字 */
    document.body.classList.add('still');
  }

  const pv = num('p');
  if (pv !== null){
    explodeP = explodeT = clamp(pv, 0, 1);
    /* 直接落到终值，不靠主循环的第一帧缓动 —— 否则静态截图会停在刚起步的位置 */
    parts.forEach(q => { q.p = q.listed ? explodeP : 0; });
    syncExplodeUI();
  }

  /* 带机位/进度/关灯参数的链接是"看成品"的，别再让人先拆一遍盒子 */
  const skipGift = q.has('still') || q.has('p') || q.has('explode') || q.has('night') || q.has('focus');
  if (skipGift){
    gift.done = true;
    gift.cakeIn = true;
    gift.root.visible = false;
    if (giftHintEl) giftHintEl.style.display = 'none';
    document.body.classList.remove('gift');
    introP = 1;
  }

  /* ?taps=2 模拟已经点过两下（盖子顶起来、缝里透光的状态），截图检查用 */
  const tv = num('taps');
  if (tv !== null && !skipGift && !gift.bursting){
    gift.taps = Math.min(gift.need - 1, Math.max(0, Math.round(tv)));
    gift.lift = gift.need ? gift.taps / gift.need : 0;
    gift.pop = 0; gift.shake = 0;
    paintGiftDots(false);
    if (gift.taps > 0) giftHintTxt.textContent = gift.taps >= gift.need ? '' : '快了…';
  }

  /* ?gift=0.4 把爆开动画冻结在某一帧，截图和调动画用 */
  const gv = num('gift');
  if (gv !== null && !skipGift){
    gift.bursting = true;
    gift.frozen = true;
    gift.burstT = clamp(gv, 0, 1);
    gift.cakeIn = gift.burstT > 0.03;
    gift.lift = 1;
    if (gift.burstT > 0.16){
      gift.fadeOn = true;
      gift.mats.forEach(m => { m.transparent = true; m.needsUpdate = true; });
    }
    giftHintEl.style.display = 'none';
    if (gift.cakeIn) introP = 1;
    if (gift.burstT > 0.02) spawnConfetti();
    if (gift.burstT > 0.34) showWish();
    document.body.classList.add('still');      // 冻结点上别让 CSS 还在淡入
    /* 相机直接落到该有的位置，别从默认距离慢慢蹭过来 —— 静态截图会抓到半路 */
    const bk = clamp((gift.burstT - 0.1) / 0.5, 0, 1);
    orbit.radius = orbit.tRadius = giftRadius() * (1 - 0.06 * bk);
    orbit.target.y = orbit.tTarget.y = gift.centerY + (1.34 - gift.centerY) * bk;
  }

  /* ?focus=moon 直接聚焦某个部件（分享某一件、或者截图用） */
  const fv = q.get('focus');
  if (fv){
    const target = listedParts.find(x => x.id === fv);
    if (target) setTimeout(() => { if (!focusPart) toggleFocus(target); }, 350);
  }
})();

paintGiftDots(false);
/* 盒子还没开的时候，蛋糕得是真的"不在"—— 否则盒盖一抬就看见一个已经成型的蛋糕 */
cakeRoot.scale.setScalar(gift.cakeIn ? 1 : 0.002);
resize();
tick();

/* ---- 收尾 ---- */
requestAnimationFrame(() => {
  const l = document.getElementById('loader');
  l.classList.add('hide');
  setTimeout(() => l.remove(), 700);
});
setTimeout(() => {
  const tip = document.getElementById('hintTip');
  if (tip) tip.style.opacity = '0.45';
}, 7000);

/* 演示用：地址里带 ?explode 打开即自动拆解；带 ?night 直接关灯 */
if (location.search.indexOf('explode') >= 0){
  setTimeout(() => document.getElementById('btnAll').click(), 1500);
}
if (location.search.indexOf('night') >= 0){
  setTimeout(() => {
    document.getElementById('btnNight').click();
    /* 分享/截图链接里直接到全暗，别让人先看到一帧亮着的棚拍 */
    night.p = 1;
  }, 300);
}

/* 调试钩子：?debug 时把内部状态挂到 window，方便调参与检查 */
if (location.search.indexOf('debug') >= 0){
  window.__cake = { parts, listedParts, night, orbit, toggleFocus, endFocus, pickPart, pickAt, camera, fitRadius, glowSprite, scene, renderer, focusLight, key, hemi, moonLight, setExplode, gift, tapGift, burstGift, finishGift, frames: () => frameCount, prog: () => explodeP };
  window.__cake.settle = (v) => {
    if (typeof v === 'number'){ explodeP = explodeT = clamp(v, 0, 1); syncExplodeUI(); }
    else explodeP = explodeT;
    parts.forEach(p => {
      p.p = !p.listed ? 0 : (focusPart ? (focusPart === p ? 1 : explodeP) : explodeP);
      p.dim = (focusPart && focusPart !== p) ? 1 : 0;
      p.appF = (focusPart === p) ? 1 : 0;
      p.appDim = -1;
      applyLook(p);
    });
    if (!focusPart){
      const spread = window.innerWidth < 820 ? 2.30 : 1.74;
      const r0 = fitRadius();
      orbit.tTarget.set(0, 1.34 + explodeP, 0);
      orbit.tRadius = r0 + (r0 * spread - r0) * explodeP;
    }
    orbit.theta = orbit.tTheta; orbit.phi = orbit.tPhi;
    orbit.radius = orbit.tRadius; orbit.target.copy(orbit.tTarget);
    glowP = focusPart ? 1 : 0;
    focusLampP = focusPart ? 1 : 0;
    if (focusPart) glowAnchor.copy(focusPart.root.position).add(focusPart.glowOff);

    /* 无头浏览器的 rAF 只有 1 帧/秒，光改数据截出来还是旧画面：
       这里手动推进一帧并把位移、标签、渲染一次做完 */
    const nowT = performance.now() * 0.001;
    updateParts(1 / 60, nowT);
    updateFocus(1 / 60, nowT, performance.now());
    updateNight(1 / 60, nowT);
    updateCamera(1 / 60);
    updateLabels();
    renderer.render(scene, camera);
  };
  window.__focus = id => {
    const p = parts.find(q => q.id === id);
    if (p) toggleFocus(p);
    return !!p;
  };
}
</script>
</body>
